<!DOCTYPE html>
<html>
<head>
    <title>My Certifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        .certificate {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 800px;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
        }
        h2 {
            margin-top: 10px;
            color: #333;
        }
        p {
            margin: 5px 0;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>My Certifications</h1>

    <div class="certificate">
        <img src="azure.png" alt="Azure Fundamentals Certificate">
        <h2>Microsoft Certified: Azure Fundamentals</h2>
        <p><b>Issued by:</b> Microsoft</p>
        <p><b>Date:</b> Jan 2024</p>
    </div>

    <div class="certificate">
        <img src="powerbi.jpg" alt="Power BI Certificate">
        <h2>Microsoft Certified: Power BI Data Analyst</h2>
        <p><b>Issued by:</b> Microsoft</p>
        <p><b>Date:</b> March 2024</p>
    </div>

</body>
</html>
